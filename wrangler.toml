name = "images-router"
main = "src/index.js"
compatibility_date = "2026-05-09"

# Route all traffic on the public hostname through this Worker.
# The hostname's DNS record (an "AAAA orange-cloud" / proxied A) lives in the
# openimages.cloud zone.
routes = [
  { pattern = "images.openimages.cloud/*", zone_name = "openimages.cloud" },
]

[vars]
# Allowlist of bucket names the Worker is willing to route to. Add the
# bucket name here for every new image repo onboarded under open-img-cloud/.
ALLOWED_BUCKETS = "freebsd-14,freebsd-15,centos-stream-10,centos-stream-9,arch-linux,fedora-44,fedora-45,opensuse-leap-16,debian-12,debian-13,ubuntu-22.04,ubuntu-24.04,ubuntu-26.04,almalinux-8,almalinux-10,rocky-linux-8,rocky-linux-10,almalinux-9,rocky-linux-9,alpaquita-linux,alpine-linux,amazon-linux-2,amazon-linux-2023,gentoo-linux,nixos,oracle-linux-8,oracle-linux-9,oracle-linux-10,windows-server-2022,octavia-amphora,cloud-rescue,manila-service-image,trove-guest-image"

# Origin: Infomaniak Object Storage (Ceph S3), Public Cloud project
# "Images_Storage" (PCP-LKEN9H4). Public buckets are read anonymously via
# path-style URLs: ${S3_ORIGIN}/${S3_TENANT}:<bucket>/<key>.
# The tenant id is not a secret: it appears in every public object URL.
S3_ORIGIN = "https://s3.gva2.infomaniak.cloud"
S3_TENANT = "c0862b7f7b6849508bbcd74fb00e7fe2"

# Daily external scheduler (src/scheduler.js): dispatches these workflows
# via workflow_dispatch, which GitHub never disables for inactivity.
# Requires the GH_DISPATCH_TOKEN secret (wrangler secret put GH_DISPATCH_TOKEN).
SCHEDULED_WORKFLOWS = "freebsd:watch.yml,centos-stream-10:watch.yml,centos-stream-9:watch.yml,arch-linux:watch.yml,fedora-44:watch.yml,fedora-45:watch.yml,opensuse-leap-16:watch.yml,debian-12:watch.yml,debian-13:watch.yml,ubuntu-22.04:watch.yml,ubuntu-24.04:watch.yml,ubuntu-26.04:watch.yml,almalinux-8:watch.yml,almalinux-10:watch.yml,rocky-linux-8:watch.yml,rocky-linux-10:watch.yml,almalinux-9:watch.yml,rocky-linux-9:watch.yml,alpaquita-linux:watch.yml,alpine-linux:watch.yml,amazon-linux-2:watch.yml,amazon-linux-2023:watch.yml,oracle-linux-8:watch.yml,oracle-linux-9:watch.yml,oracle-linux-10:watch.yml,gentoo-linux:watch.yml,nixos:watch.yml,oic-website:deploy.yml,manila-service-image:watch.yml,trove-guest-image:watch.yml"

# Weekly (Mondays 04:00 UTC, cron must match WEEKLY_CRON in src/scheduler.js):
# catalog-wide re-validation of every published image.
WEEKLY_WORKFLOWS = ".github:catalog-audit.yml"

# Download statistics (src/stats.js). User-Agent substrings that are never
# counted: our own CI (validate-image, smoke-openstack, catalog audit).
STATS_EXCLUDE_UA = "openimages-,oic-ci"
STATS_DATASET = "oic_downloads"

# Download statistics: one data point per counted qcow2 download. The dataset
# is created automatically on the first write (3 months of retention).
[[analytics_engine_datasets]]
binding = "DOWNLOADS"
dataset = "oic_downloads"

# Analytics SQL binding: lets /_stats.json query the dataset without an API
# token (Wrangler >= 4.145).
[analytics]
binding = "ANALYTICS_SQL"

# Optional: all-time totals. Without it, /_stats.json covers the last 90 days.
# Create once with `npx wrangler kv namespace create oic-download-stats`,
# then uncomment and paste the id. The daily cron rolls finished days into it.
# [[kv_namespaces]]
# binding = "STATS_KV"
# id = "<oic-download-stats namespace id>"

[triggers]
crons = ["40 5 * * *", "0 4 * * 1"]  # daily watchers 05:40 UTC; weekly audit Monday 04:00 UTC

# Observability: keep request logs for debugging path/cache issues.
[observability]
enabled = true
head_sampling_rate = 1.0
