name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: '24'

      # Unit tests use only node:test, no dependency install needed.
      - name: Unit tests
        run: node --test

      - name: Validate wrangler.toml
        run: npx --yes wrangler@4 deploy --dry-run --outdir /tmp/dry-run
